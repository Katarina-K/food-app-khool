<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./khool-style.css">

    <title>Khool Recipes</title>
</head>

<body>

    <main class="page">

        <header class="main-header">
            <h1>KHOOL</h1>
        </header>

        <!-- Breakfast -->
        <section class="meal">

            <img
                class="menu-image"
                src="./breakfast.png"
                alt="Berry Granola Yogurt Bowl"
            >

            <div class="meal-info">
                <h2>Breakfast</h2>

                <p>Berry Granola Yogurt Bowl</p>

                <button>Full recipe</button>
            </div>

        </section>


        <!-- Lunch -->
        <section class="meal">

            <div class="meal-info">
                <h2>Lunch</h2>

                <p>Grilled Chicken & Avocado Power Bowl</p>

                <button>Full recipe</button>
            </div>

            <img
                class="menu-image"
                src="./lunch.png"
                alt="Grilled Chicken and Avocado Power Bowl"
            >

        </section>


        <!-- Dinner -->
        <section class="meal">

            <img
                class="menu-image"
                src="./dinner.png"
                alt="Honey Glazed Salmon with Rice"
            >

            <div class="meal-info">
                <h2>Dinner</h2>

                <p>Honey Glazed Salmon with Rice</p>

                <button>Full recipe</button>
            </div>

        </section>


        <!-- Shopping list -->
        <section class="shopping">

            <button class="shopping-button">

                <span>Shopping List</span>

                <img
                    class="shopping-icon"
                    src="./shopping.png"
                    alt="Shopping List"
                >

            </button>

        </section>

    </main>

</body>

</html>
